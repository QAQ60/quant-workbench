<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨霖量化 - 量化选股工作台</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2a3341;
  --text:#e6edf3; --muted:#8b949e; --up:#f85149; --down:#3fb950;
  --accent:#58a6ff; --gold:#d29922; --purple:#a371f7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.5}
.app{display:flex;flex-direction:column;min-height:100vh}
/* 顶栏 */
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:20px;flex-shrink:0}
.logo{font-size:17px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.topnav{display:flex;gap:4px;flex:1}
.topnav button{background:transparent;border:none;color:var(--muted);padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;transition:.15s;white-space:nowrap}
.topnav button:hover{background:var(--panel2);color:var(--text)}
.topnav button.active{background:rgba(88,166,255,.15);color:var(--accent);font-weight:600}
.balance{display:flex;align-items:center;gap:6px;color:var(--gold);font-weight:600;white-space:nowrap}
.balance .coin{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#f0b429,#d29922);display:inline-block}
.user-chip{background:var(--panel2);border:1px solid var(--border);padding:5px 12px;border-radius:16px;color:var(--muted)}
/* 内容 */
.content{flex:1;padding:18px 20px;overflow:auto}
.tabpage{display:none}.tabpage.active{display:block}
/* 网格 */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:15px}
.card h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .bar{width:3px;height:13px;background:var(--accent);border-radius:2px}
.row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between}
.muted{color:var(--muted)}.up{color:var(--up)}.down{color:var(--down)}
.big{font-size:22px;font-weight:700}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{filter:brightness(1.1)}.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:4px 10px;font-size:12px}
/* 涨跌分布条 */
.dist{display:flex;height:9px;border-radius:5px;overflow:hidden;gap:1px;margin:8px 0}
.dist div{height:100%}
.dist-labels{display:flex;justify-content:space-between;font-size:11px;flex-wrap:wrap;gap:6px}
/* 表格 */
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--muted);font-weight:500;text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid rgba(42,51,65,.5);white-space:nowrap}
tr:hover td{background:var(--panel2)}
.code{color:var(--muted);font-size:11px}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;background:rgba(88,166,255,.15);color:var(--accent)}
.tag.red{background:rgba(248,81,73,.15);color:var(--up)}.tag.green{background:rgba(63,185,80,.15);color:var(--down)}
/* 板块条 */
.sector{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px}
.sector .name{width:70px;color:var(--text)}.sector .bar{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.sector .bar i{display:block;height:100%;border-radius:3px}.sector .val{width:52px;text-align:right}
/* 选股条件 */
.cond{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:12px;color:var(--muted);font-size:12px;line-height:1.8}
.cond b{color:var(--text)}
select,input[type=text]{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:5px;font-size:12px;outline:none}
/* K线占位 */
.chart{height:200px;background:linear-gradient(180deg,rgba(88,166,255,.05),transparent);border-radius:6px;position:relative;overflow:hidden}
.chart svg{width:100%;height:100%}
/* 预警项 */
.alert-item{padding:10px 0;border-bottom:1px solid var(--border)}
.alert-item .top{display:flex;justify-content:space-between;align-items:center}
.alert-item .meta{color:var(--muted);font-size:11px;margin-top:3px}
/* AI 对话 */
.ai-layout{display:flex;height:calc(100vh - 130px);gap:14px}
.ai-side{width:230px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;flex-shrink:0;overflow:auto}
.ai-side button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--muted);padding:8px;border-radius:5px;cursor:pointer;font-size:12px}
.ai-side button:hover,.ai-side button.active{background:var(--panel2);color:var(--text)}
.ai-main{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.ai-msgs{flex:1;padding:18px;overflow:auto}
.msg{margin-bottom:16px;padding:12px 14px;border-radius:8px;max-width:85%;line-height:1.7}
.msg.user{background:rgba(88,166,255,.15);margin-left:auto}
.msg.ai{background:var(--panel2)}
.msg h4{color:var(--accent);font-size:12px;margin-bottom:6px}
.ai-input{border-top:1px solid var(--border);padding:12px;display:flex;gap:10px}
.ai-input input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;outline:none}
/* 盯盘 */
.watch-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.toggle{width:36px;height:20px;background:var(--border);border-radius:10px;position:relative;cursor:pointer;transition:.2s}
.toggle.on{background:var(--accent)}.toggle i{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on i{left:18px}
/* 提示 */
.disclaimer{color:var(--muted);font-size:11px;padding:8px 0;text-align:center}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.topnav{overflow-x:auto}.ai-side{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo"><span class="dot"></span>雨霖量化</div>
    <div class="topnav">
      <button class="active" data-tab="hangqing">行情</button>
      <button data-tab="xuangu">选股</button>
      <button data-tab="zixuan">自选</button>
      <button data-tab="huice">回测</button>
      <button data-tab="yujing">预警</button>
      <button data-tab="ai">雨森AI</button>

    <div class="user-chip">雨森量化</div>
    <div class="balance"><span class="coin"></span>1,780</div>

      <div class="msg ai"><h4>雨森AI · 多角色深度分析</h4>你好！我有 <b>12 个 agent</b> 为你分析：技术面 / 基本面 / 消息面 / 情绪资金 → 多空辩论 → 研究主管 → 交易员 → 三方风险 → 风险主管。输入股票代码（如 600519）开始分析，完整模式需 1-2 分钟，报告会直接写进当前对话。</div>
      <div class="msg user">分析一下昨天的涨停规律</div>
      <div class="msg ai"><h4>研究主管 · 复盘结论</h4><b>规律一：9:30-9:45 封板的票，当天封板率最高，且封单额普遍较大。</b>这批票的共同点是竞价高开 3%-7%，开盘后快速拉升封板。<br><br>11/18 开盘15分钟内封板：春光科技（09:30，封单4501万）、真视通（09:30，封单1.08亿）、武汉凡谷（09:30，封单1.23亿）、四川长虹（09:35，封单2.10亿）、北纬科技（09:30）、动力源（09:30）、澳柯玛（09:30）、双环科技（09:42）、创益通（09:45）。<br><br><b>结论：</b>竞价高开 + 早盘快速封板，是强势首板的核心特征。</div>

    <div class="ai-input"><input placeholder="问我行情、股票代码，如 600519"><button class="btn">发送</button></div>

const renders={hangqing:renderHangqing,xuangu:renderXuangu,zixuan:renderZixuan,huice:renderHuice,yujing:renderYujing,ai:renderAI};
function drawKline(){const el=document.getElementById('kline');if(!el)return;
  const pts=[];for(let i=0;i<60;i++){pts.push(80+Math.sin(i/5)*30+Math.sin(i/13)*20+(Math.random()-.5)*8)}
  const path=pts.map((y,i)=>`${i?'L':'M'} ${i/59*100} ${100-y/2}`).join(' ');
  el.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity=".3"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient></defs><path d="${path} L 100 100 L 0 100 Z" fill="url(#g)"/><path d="${path}" fill="none" stroke="#58a6ff" stroke-width="0.7"/></svg>`;
}
async function loadRealData(tab){
  if(tab==='hangqing'){
    const m=await api('/api/market');
    if(m){D.market={...D.market,...m};D.indices=[{name:'上证指数',val:'实时',chg:m.up>m.down?'+':'-',down:m.up<=m.down},{name:'创业板指',val:String(m.total),chg:'只',down:false},{name:'涨/跌',val:m.up+'/'+m.down,chg:'',down:false},{name:'成交额',val:m.amount,chg:'',down:false}];show(tab)}
  }else if(tab==='xuangu'){
    const s=await api('/api/select');
    if(s&&s.results){D.pickResult=s.results.map(x=>({code:x.code,name:x.name,price:String(x.price),chg:('+' + x.chg.toFixed(2)+'%'),amount:x.amount,ma20:x.ma20,rsi:x.rsi14}));
      D.scanInfo=`${s.strategy==='lin_gongzi'?'林公子策略':'策略'} · 全市场 ${f(s.scanned)} 只（可交易 ${f(s.tradable)} · 剔除ST ${s.excluded_st} · 初筛 ${f(s.prescreen)}）命中 <b class="up">${s.hits}</b> · 用时 3s`;show(tab)}
  }else if(tab==='yujing'){
    const a=await api('/api/alerts');
    if(a&&a.length){D.alerts=a.map(x=>({name:x.name,code:x.code,price:String(x.price),chg:('+'+x.chg.toFixed(2)+'%'),gap:String(x.gap),type:x.type,meta:x.meta}));show(tab)}
  }else if(tab==='zixuan'){
    const l=await api('/api/stocks');
    if(l&&l.length){D.watch=l.slice(0,5).map(x=>({code:x.code,name:x.name,price:String(x.price),chg:(x.chg>=0?'+':'')+x.chg.toFixed(2)+'%'}));show(tab)}
  }
}
let loading={};
function show(tab){
  document.querySelectorAll('.topnav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.getElementById('content').innerHTML=(renders[tab]||renderHangqing)();
  if(tab==='huice')drawKline();
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
  if(!loading[tab]){loading[tab]=true;loadRealData(tab)}
}
// 选股结果统计条用真实数据（替换 renders 对象里的引用）
const _rx=renders.xuangu;
renders.xuangu=function(){let h=_rx();if(D.scanInfo)h=h.replace(/林公子策略 · 全市场[^<]*命中 <b class="up">1<\/b> · 用时 3s/,D.scanInfo);return h};
show('hangqing');
</script>
